[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faco-voicetype"
version = "1.2.1"
description = "Global Linux mouse-button voice-to-text utility"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dan Merluse" }]
requires-python = ">=3.10"
keywords = ["linux", "speech-to-text", "voice-typing", "whisper", "wayland", "x11"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/MerluseDan/FACO-VoiceType"
Issues = "https://github.com/MerluseDan/FACO-VoiceType/issues"
Changelog = "https://github.com/MerluseDan/FACO-VoiceType/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
