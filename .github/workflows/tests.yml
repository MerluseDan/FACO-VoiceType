name: Linux QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-install-and-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and test
        run: |
          python3 -m compileall -q faco_watch scripts
          python3 -m unittest discover -s tests -q
          node tests/test_frontend.cjs
          node tests/test_gnome_extension.cjs
      - name: Bash syntax
        run: bash -n install.sh run.sh uninstall.sh verify.sh
      - name: SHA-256 release manifest
        run: ./verify.sh
